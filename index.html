<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BigLuma</title>

    <style>

        /* =========================
           GENERAL PAGE
        ========================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: black;
            color: white;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            padding: 40px 20px;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }


        /* =========================
           HEADINGS
        ========================= */

        h1 {
            color: whitesmoke;
            font-size: 55px;
            line-height: 1.1;
            margin: 0 0 10px;
        }

        h2 {
            font-size: 28px;
            line-height: 1.2;
            margin: 0 0 20px;
        }


        /* =========================
           ARTIST IMAGE
        ========================= */

        img {
            display: block;
            width: 230px;
            max-width: 80%;
            height: auto;
            margin: 20px auto;
            border-radius: 20px;
        }


        /* =========================
           DESCRIPTION
        ========================= */

        p {
            font-size: 22px;
            line-height: 1.4;
            margin: 20px 0;
        }


        /* =========================
           ALL BUTTONS
        ========================= */

        .social-links {
            width: 100%;
            max-width: 320px;
            margin: 30px auto 0;

            display: flex;
            flex-direction: column;
            align-items: stretch;

            gap: 14px;
        }


        /* SAME FORMAT FOR EVERY BUTTON */

        .social-links a {
            display: block;

            width: 100%;
            height: 48px;

            margin: 0;
            padding: 14px 20px;

            background: rgb(236, 242, 243);
            color: black;

            text-decoration: none;
            font-weight: bold;
            font-size: 16px;

            border-radius: 10px;

            text-align: center;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* HOVER */

        .social-links a:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            body {
                padding: 35px 20px;
            }

            h1 {
                font-size: 48px;
            }

            h2 {
                font-size: 26px;
            }

            p {
                font-size: 20px;
            }

        }


        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {
                padding: 30px 15px;
            }

            .container {
                max-width: 100%;
            }

            h1 {
                font-size: 40px;
            }

            h2 {
                font-size: 24px;
            }

            img {
                width: 200px;
                max-width: 75%;
                margin: 18px auto;
            }

            p {
                font-size: 18px;
            }

            .social-links {
                max-width: 300px;
                gap: 12px;
                margin-top: 25px;
            }

            .social-links a {
                height: 46px;
                padding: 12px 18px;
                font-size: 16px;
            }

        }

    </style>

</head>


<body>

    <main class="container">


        <!-- ARTIST NAME -->

        <h1>BigLuma</h1>

        <h2>Nonstop</h2>


        <!-- ARTIST IMAGE -->

        <img src="me.jpg" alt="BigLuma">


        <!-- DESCRIPTION -->

        <p>
            Artist. Real stories. Real energy.
        </p>


        <!-- =========================
             ALL BUTTONS
             SAME SIZE / SAME FORMAT
        ========================= -->

        <div class="social-links">

            <a href="https://www.instagram.com/bigluma_">
                Instagram
            </a>

            <a href="https://www.youtube.com/@bigluma">
                YouTube
            </a>

            <a href="https://www.tiktok.com/@bigluma_1">
                TikTok
            </a>

            <a href="https://www.twitter.com/bigluma_">
                Twitter
            </a>

            <a href="https://www.soundcloud.com/bigluma_">
                SoundCloud
            </a>

            <a href="https://www.spotify.com/artists/bigluma">
                Spotify
            </a>

            <a href="mailto:biglumamusic@gmail.com">
                Collaboration
            </a>

        </div>


    </main>

</body>

</html>
